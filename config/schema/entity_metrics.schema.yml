# Schema for the configuration files of the Entity Metrics module.
entity_metrics.settings:
  type: config_object
  label: 'Entity Metrics settings'
  mapping:
    cookie:
      type: string
      label: 'Cookie'
    geolocation_enabled:
      type: boolean
      label: 'Process geolocation on cron'
    geolocation_database:
      type: string
      label: 'Local City MMDB path'
    geolocation_batch_size:
      type: integer
      label: 'Events processed per cron run'
