name: CI

on:
  push:
    branches: [ 1.x ]
  pull_request:
    branches: [ 1.x ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        php-versions: ["8.4"]
        drupal-version: ["10.6", "11.3", "11.4"]
    name: PHP ${{ matrix.php-versions }} | drupal ${{ matrix.drupal-version }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: PHPUNIT tests
        run: |
          docker run \
            --rm \
            --name drupal \
            --hostname drupal \
            --volume $(pwd):/var/www/drupal/web/modules/contrib/$ENABLE_MODULES:ro \
            --env ENABLE_MODULES \
           ghcr.io/islandora/ci:${{ matrix.drupal-version }}-php${{ matrix.php-versions }}
        env:
          ENABLE_MODULES: entity_metrics

